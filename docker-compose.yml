# Local demo services for PostgreSQL source data and Neo4j persistent storage.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: business_ontology
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ontology_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_dev_password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
