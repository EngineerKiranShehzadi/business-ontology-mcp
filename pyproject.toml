# Project metadata and runtime/test dependencies.

[project]
name = "business-ontology-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "networkx>=3.5",
  "pydantic>=2.12",
  "psycopg[binary]>=3.2",
  "neo4j>=5.28",
  "python-dotenv>=1.2",
  "pypdf>=6.1",
  "python-docx>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
